[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "vayuswarm"
version = "0.1.0"
description = "AI-Powered Swarm Drone Software — hierarchical LLM architecture with multi-modal vision pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "VayuSwarm Team"},
]

dependencies = [
    # Communication
    "pyzmq>=25.1.0",
    "pydantic>=2.5.0",

    # Flight Control
    "pymavlink>=2.4.41",

    # Vision Pipeline
    "ultralytics>=8.1.0",
    "opencv-python>=4.9.0",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "numpy>=1.26.0",

    # LLM Integration
    "httpx>=0.27.0",
    "openai>=1.12.0",
    "onnxruntime>=1.17.0",

    # Dashboard
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",

    # Config & Logging
    "pyyaml>=6.0.1",
    "structlog>=24.1.0",

    # Utilities
    "click>=8.1.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
]

[project.scripts]
vayuswarm-drone = "scripts.launch_drone:main"
vayuswarm-ground = "scripts.launch_ground:main"
vayuswarm-swarm = "scripts.launch_swarm:main"
vayuswarm-dashboard = "scripts.launch_dashboard:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "proto*", "scripts*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Disable ROS2 Jazzy pytest plugins that conflict with venv
addopts = "-p no:launch_ros -p no:launch_testing -p no:launch -p no:launch_testing_ros -p no:ament_copyright -p no:ament_xmllint -p no:ament_lint -p no:ament_flake8 -p no:ament_pep257 -p no:launch_testing_ros_pytest_entrypoint"
