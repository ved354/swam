# ╔═══════════════════════════════════════════════════════════════╗
# ║          VayuSwarm — PX4 SITL Config                         ║
# ║  Connects to a running PX4 SITL instance via MAVLink UDP     ║
# ║                                                               ║
# ║  Prerequisites:                                               ║
# ║    1. Clone PX4-Autopilot repo                                ║
# ║    2. Run:  make px4_sitl jmavsim   (or gazebo)               ║
# ║       SITL listens on udp:127.0.0.1:14540                     ║
# ║    3. Then:  python scripts/launch_drone.py \                  ║
# ║              --config config/sitl.yaml --id drone-0            ║
# ╚═══════════════════════════════════════════════════════════════╝

system:
  name: "VayuSwarm"
  version: "0.1.0"
  log_level: "DEBUG"
  log_format: "console"
  simulation: false              # <-- real MAVLink to PX4 SITL

# ─── PX4 Connection ────────────────────────────────────────────
px4:
  connection_string: "udp:127.0.0.1:14540"
  source_system: 255             # GCS system ID
  source_component: 0
  # For multi-vehicle SITL, PX4 uses ports 14540, 14541, 14542 …
  # Override per drone:
  #   drone-0: udp:127.0.0.1:14540
  #   drone-1: udp:127.0.0.1:14541
  #   drone-2: udp:127.0.0.1:14542

# ─── Communication ──────────────────────────────────────────────
comms:
  protocol: "tcp"
  ground_pub_port: 5555
  ground_sub_port: 5556
  mesh_base_port: 6000
  heartbeat_interval_s: 2.0
  heartbeat_timeout_s: 10.0
  message_ttl_s: 30.0

# ─── LLM — Mock for SITL testing ────────────────────────────────
llm:
  ground:
    provider: "mock"
    model: "mock"
    endpoint: "http://localhost:11434"
    temperature: 0.3
    max_tokens: 2048
    timeout_s: 5.0
  drone:
    provider: "mock"
    model: "mock"
    endpoint: "http://localhost:11434"
    temperature: 0.2
    max_tokens: 512
    timeout_s: 5.0

# ─── Vision ─────────────────────────────────────────────────────
vision:
  camera:
    source: null                 # null = synthetic frames (no camera in SITL)
    width: 640
    height: 480
    fps: 15
    loop: true
  yolo:
    model_path: "models/yolo/best.pt"
    confidence_threshold: 0.5
    iou_threshold: 0.45
    device: "auto"
    classes:
      person: 0.5
      vehicle_car: 0.5
      weapon_rifle: 0.6
  thermal:
    enabled: true
    model_path: "models/thermal/thermal_classifier.onnx"
    temperature_person_min_c: 30.0
    temperature_person_max_c: 42.0
  fusion:
    iou_match_threshold: 0.3
    confidence_boost: 0.15
  behavior:
    window_size: 30
    model_path: "models/behavior/behavior_transformer.onnx"
    evasion_speed_threshold_ms: 3.0
    formation_spacing_threshold_m: 5.0

# ─── Safety ─────────────────────────────────────────────────────
safety:
  enabled: true
  battery_critical_pct: 15
  geofence:
    enabled: true
    center_lat: 17.385044
    center_lon: 78.486671
    radius_m: 500
    max_altitude_m: 120
    min_altitude_m: 5
  no_go_zones: []

# ─── Dashboard ──────────────────────────────────────────────────
dashboard:
  host: "0.0.0.0"
  port: 8080
  enable_websocket: true
